# Token web app — tokenchat.dev
# Matrix federation discovery — .well-known

server {
    listen 80;
    listen [::]:80;
    server_name tokenchat.dev;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tokenchat.dev;

    ssl_certificate     /etc/letsencrypt/live/tokenchat.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokenchat.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # PWA — разрешаем установку с любого источника (нужно для матрикс-клиента)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Matrix federation discovery
    location /.well-known/matrix/server {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.server":"matrix.tokenchat.dev:443"}';
    }

    location /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.tokenchat.dev"},"m.identity_server":{"base_url":"https://vector.im"}}';
    }

    # Token web app (Docker container on port 8080)
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache static assets aggressively
        location ~* \.(js|css|wasm|woff2?|ttf|ico|png|jpg|svg)$ {
            proxy_pass       http://127.0.0.1:8080;
            proxy_set_header Host $host;
            expires          1y;
            add_header       Cache-Control "public, immutable";
        }

        # Never cache service worker or config
        location ~* (sw\.js|config\.json|manifest\.json)$ {
            proxy_pass       http://127.0.0.1:8080;
            proxy_set_header Host $host;
            expires          -1;
            add_header       Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
