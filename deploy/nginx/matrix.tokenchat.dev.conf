# Synapse Matrix homeserver — matrix.tokenchat.dev

server {
    listen 80;
    listen [::]:80;
    server_name matrix.tokenchat.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matrix.tokenchat.dev;

    ssl_certificate     /etc/letsencrypt/live/matrix.tokenchat.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.tokenchat.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Large file uploads (media)
    client_max_body_size 50M;

    location ~* ^(\/_matrix|\/_synapse\/client) {
        proxy_pass         http://127.0.0.1:8008;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (for sync)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Long-poll timeouts for Matrix /sync
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # Buffer settings for large media
        proxy_buffering        on;
        proxy_buffer_size      128k;
        proxy_buffers          4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Block everything else
    location / {
        return 404;
    }
}

# Federation port (Matrix server-to-server)
server {
    listen 8448 ssl;
    listen [::]:8448 ssl;
    http2 on;
    server_name matrix.tokenchat.dev;

    ssl_certificate     /etc/letsencrypt/live/matrix.tokenchat.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.tokenchat.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:8008;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
