# Synapse Matrix homeserver — matrix.tokenchat.dev

# Response cache for read-only Matrix endpoints
proxy_cache_path /var/cache/nginx/matrix levels=1:2 keys_zone=matrix_cache:10m max_size=100m inactive=10m;

server {
    listen 80;
    listen [::]:80;
    server_name matrix.tokenchat.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matrix.tokenchat.dev;

    ssl_certificate     /etc/letsencrypt/live/matrix.tokenchat.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.tokenchat.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip compression for JSON responses
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;
    gzip_proxied any;

    # CORS headers for all Matrix endpoints
    # proxy_hide_header strips Synapse's own CORS headers to prevent duplicates
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Date" always;
    add_header Access-Control-Expose-Headers "Synapse-Trace-Id, Server" always;

    # Large file uploads (media)
    client_max_body_size 5M;

    # Cache read-only GET endpoints (versions, login flows, capabilities)
    location ~* ^/_matrix/client/(versions|v3/login)$ {
        proxy_pass         http://127.0.0.1:8008;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache            matrix_cache;
        proxy_cache_valid      200 5m;
        proxy_cache_methods    GET HEAD;
        proxy_cache_key        "$request_method$request_uri";
        add_header             X-Cache-Status $upstream_cache_status;
        add_header             Cache-Control "public, max-age=600, s-maxage=3600, stale-while-revalidate=600";
    }

    location ~* ^(\/_matrix|\/_synapse\/client) {
        proxy_pass         http://127.0.0.1:8008;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (for sync)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Long-poll timeouts for Matrix /sync
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # Buffer settings for large media
        proxy_buffering        on;
        proxy_buffer_size      128k;
        proxy_buffers          4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Block everything else
    location / {
        return 404;
    }
}

# Federation port (Matrix server-to-server)
server {
    listen 8448 ssl;
    listen [::]:8448 ssl;
    http2 on;
    server_name matrix.tokenchat.dev;

    ssl_certificate     /etc/letsencrypt/live/matrix.tokenchat.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.tokenchat.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5M;

    location / {
        proxy_pass         http://127.0.0.1:8008;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
