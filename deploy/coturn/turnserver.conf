# coturn config for tokenchat.dev
# TURN/TURNS server for Matrix WebRTC calls

listening-port=3478
tls-listening-port=5349

# Allow TCP on standard ports for Russia/restrictive ISPs
alt-listening-port=443
alt-tls-listening-port=443

listening-ip=0.0.0.0
external-ip=80.96.108.89

realm=tokenchat.dev
server-name=tokenchat.dev

# Use HMAC-SHA1 shared secret (Synapse generates time-limited credentials)
use-auth-secret
static-auth-secret=TURN_SECRET_PLACEHOLDER

# TLS certs (Let's Encrypt via certbot, already on server)
cert=/etc/letsencrypt/live/tokenchat.dev/fullchain.pem
pkey=/etc/letsencrypt/live/tokenchat.dev/privkey.pem

# Security — block private/internal IPs (prevent SSRF)
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Logging
log-file=/var/log/coturn/turnserver.log
simple-log

# Performance
min-port=49152
max-port=65535
